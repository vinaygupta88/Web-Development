<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS practice 5</title>
</head>

<body>
    <h1>Task 5 </h1>
    <p><b>Question: </b>Create a new button element, Give it a text "click me", background color of red & text color of white. Insert the button as the first element inside the body tag.</p> <br />
    <p>Result: <span id="output" style="color: rgb(17, 99, 171); font-weight: 700;"></span> </p>



    <script>
        let newbtn = document.createElement("button");
        newbtn.innerText = "click me";

        newbtn.style.color = "white";
        newbtn.style.backgroundColor = "red";

        document.querySelector("body").append(newbtn);
    </script>
</body>

</html>
